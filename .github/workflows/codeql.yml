name: CodeQL

# Advanced CodeQL setup with a real Gradle build ("manual" build mode).
# The default setup ("build-mode: none") can't resolve Minecraft / Fabric classes,
# which gave the "Low Java analysis quality" warning (45% of calls resolved).
#
# IMPORTANT: disable the default setup first (Settings → Code security →
# CodeQL analysis → "..." → Switch to advanced / Disable), otherwise GitHub refuses
# the results of this workflow.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # every Monday 04:17 UTC

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build (compiled sources are traced by CodeQL)
        run: ./gradlew clean compileJava --no-build-cache --no-configuration-cache --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
