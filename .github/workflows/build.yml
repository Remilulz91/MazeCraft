name: Build

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Must chmod + download gradle-wrapper.jar BEFORE setup-gradle,
      # otherwise setup-gradle's wrapper validation falls back to the
      # system Gradle (9.x) which is incompatible with fabric-loom 1.7.
      - name: Download gradle-wrapper.jar if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.10.0/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build PUBLIC variant
        run: ./gradlew build --stacktrace

      - name: Save public JAR
        run: |
          mkdir -p artifacts
          cp build/libs/*.jar artifacts/

      - name: Build DEBUG variant
        run: ./gradlew clean build -PbuildType=debug --stacktrace

      - name: Save debug JAR
        run: cp build/libs/*.jar artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mazecraft-build
          path: artifacts/*.jar
          retention-days: 14
