name: Release

# Triggered when a tag matching v* is pushed (e.g. v0.1.0-alpha.2, v0.2.0, v1.0.0).
# Builds the PUBLIC JAR, creates a GitHub Release with it, and publishes to
# https://modrinth.com/mod/mazecraft via the mod-publish-plugin (needs
# MODRINTH_TOKEN secret set in repo settings).

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build PUBLIC variant
        run: ./gradlew build --stacktrace

      - name: Locate PUBLIC JAR
        id: locate_public
        run: |
          # Pick the main JAR, excluding sources and any debug variant
          PUBLIC_JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | grep -v -- '-debug' | head -1)
          if [ -z "$PUBLIC_JAR" ]; then
            echo "No public JAR found in build/libs/"
            ls -la build/libs/
            exit 1
          fi
          echo "Public JAR: $PUBLIC_JAR"
          echo "path=$PUBLIC_JAR" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section for this tag
        id: changelog
        run: |
          # The tag is v0.1.0-alpha.2, the CHANGELOG heading is [0.1.0-alpha.2].
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Looking for CHANGELOG section [$TAG_VERSION]"
          BODY=$(awk -v ver="$TAG_VERSION" '
            $0 ~ "^## \\["ver"\\]" {flag=1; next}
            flag && $0 ~ "^## \\[" {flag=0}
            flag {print}
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="No changelog entry found for $TAG_VERSION. See CHANGELOG.md."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_public.outputs.path }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          # Any alpha/beta tag is flagged as pre-release
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Modrinth
        run: ./gradlew publishMods --stacktrace
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
